<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosmic Cadet 3D – Pinball Espacial</title>
<style>
:root{color-scheme:dark;--bg:#05060f;--fg:#e8f0ff;--ac:#35e0ff;--mg:#ff3fa4;--am:#ffb347;--pn:#12142e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--pn);border-bottom:2px solid var(--ac);font-size:13px}
#hud div{display:flex;flex-direction:column;min-width:0}
#hud small{opacity:.65;font-size:10px}
#hud b{font-size:18px;color:var(--ac);white-space:nowrap}
#hud #rk{color:var(--am)}
.act{position:absolute;top:8px;right:8px;z-index:2;display:flex;gap:6px}
.act button,#ov button{font:700 14px "Trebuchet MS",system-ui,sans-serif;color:var(--fg);background:rgba(10,12,34,.85);border:2px solid var(--ac);border-radius:10px;padding:8px 12px;min-height:40px}
.act button:active{background:var(--ac);color:#021}
#ov .ob{background:none;border:0;padding:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0 6px}
#ov button{pointer-events:auto;font-size:16px;padding:12px 18px}
#ov button.p{background:var(--am);border-color:var(--am);color:#1a1000}
.act button:focus-visible,#ov button:focus-visible{outline:3px solid #fff}
#w{flex:1;min-height:0;position:relative;overflow:hidden}
canvas{display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ov div{background:rgba(3,4,16,.82);border:2px solid var(--ac);border-radius:14px;padding:18px 24px;text-align:center;max-width:80%}
#ov h1{margin:0 0 8px;font-size:clamp(22px,6vw,34px);color:var(--ac)}
#ov p{margin:4px 0;font-size:14px}
#ov .s{opacity:.65;font-size:12px}
#mg{position:absolute;left:0;right:0;bottom:20%;text-align:center;font-weight:700;font-size:clamp(15px,4.5vw,22px);color:#ffe45e;text-shadow:0 0 10px #000,0 0 4px #000;pointer-events:none;transition:opacity .3s}
#ctl{display:flex;gap:8px;padding:8px 10px 10px;background:var(--pn);border-top:2px solid var(--mg)}
#ctl button{flex:1;height:62px;border:2px solid var(--ac);border-radius:14px;background:#0a0c22;color:var(--fg);font:700 16px "Trebuchet MS",system-ui,sans-serif;touch-action:none}
#ctl button.l{border-color:var(--am);flex:1.3}
#ctl button:active,#ctl button.on{background:var(--ac);color:#021}
#ctl button.l:active{background:var(--am)}
#ctl button:focus-visible{outline:3px solid #fff}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><small>Pontos</small><b id="sc">0</b></div>
    <div><small>Bolas</small><b id="bl">3</b></div>
    <div><small>Bônus</small><b id="mu">x1</b></div>
    <div><small>Patente</small><b id="rk">Cadete</b></div>
  </div>
  <div id="w">
    <canvas id="c"></canvas>
    <div id="ov"><div><h1 id="ot">COSMIC CADET</h1><p id="o1">Suba de patente, de Cadete a Almirante</p><div class="ob"><button id="oC"></button><button id="oN"></button></div><p class="s">Teclado: A / D ou ← → · Espaço ou S lança · P pausa</p></div></div>
    <div class="act"><button id="bPa">⏸ Pausar</button><button id="bSv">Salvar</button></div><div id="mg"></div>
  </div>
  <div id="ctl">
    <button id="bL">◀ Esquerdo</button>
    <button id="bP" class="l">Lançar</button>
    <button id="bR">Direito ▶</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),cv=$('c'),wrap=$('w');
const W=400,H=700,R=8,G=720,SUB=6,L=50,A0=.49,A1=-.52;

/* ---------- geometria / física (plano 2D) ---------- */
const S=[],sg=(a,b,c,d,e=.35,k=0)=>S.push([a,b,c,d,e,k]);
for(let i=0;i<28;i++){const p=Math.PI+Math.PI*i/28,q=Math.PI+Math.PI*(i+1)/28;sg(200+180*Math.cos(p),200+180*Math.sin(p),200+180*Math.cos(q),200+180*Math.sin(q),.3)}
sg(20,200,20,570);sg(380,200,380,700);sg(358,250,358,700);sg(358,688,380,688,.1);
sg(20,570,130,630);sg(358,570,250,630);
sg(50,470,105,545,.5,1);sg(328,470,273,545,.5,1);
const BU=[{x:140,y:210,r:24},{x:240,y:210,r:24},{x:190,y:290,r:24},{x:190,y:410,r:18,moving:true}];
const GATE={x:358,end:380,y:250,open:0};
let tableTime=0;
function resetObstacles(t=0){tableTime=t;GATE.open=0;for(const s of S)s.cool=0;for(const u of BU){u.f=0;u.cool=0;u.vx=0;if(u.moving)u.x=190+38*Math.sin(tableTime*1.6)}}
const PO=[{x:92,y:345},{x:288,y:345}];
const LT=[{x:130,y:80},{x:190,y:68},{x:250,y:80}];
const FL=[{px:130,py:630,s:1,a:A0,w:0,on:0},{px:250,py:630,s:-1,a:A0,w:0,on:0}];
const RANKS=[["Cadete",0],["Alferes",5000],["Tenente",15000],["Capitão",35000],["Comandante",70000],["Almirante",120000]];

let paused=false,state='ready',score=0,balls=3,mult=1,rank=0,lit=[0,0,0],b,charge=false,pw=0,msg='',mt=0,over=0;
function newBall(){b={x:369,y:680,vx:0,vy:0,hid:0,to:0,idle:0};lit=[0,0,0];mult=1;charge=false;pw=0;resetObstacles();hud()}
function hud(){$('sc').textContent=score.toLocaleString('pt-BR');$('bl').textContent=balls;$('mu').textContent='x'+mult;$('rk').textContent=RANKS[rank][0]}
function setB(id,t,fn,p){const e=$(id);e.textContent=t;e.onclick=fn;e.className=p?'p':'';e.style.display=''}
function ov(){$('bPa').textContent=paused?'▶ Continuar':'⏸ Pausar';const show=state!=='play'||paused;$('ov').style.display=show?'flex':'none';if(!show)return;
 if(paused){$('ot').textContent='PAUSADO';$('o1').textContent='Salve para continuar depois.';setB('oC','Continuar',togglePause,1);setB('oN','Salvar jogo',doSave)}
 else{$('ot').textContent=state==='over'?'FIM DE JOGO':'COSMIC CADET';$('o1').textContent=state==='over'?over.toLocaleString('pt-BR')+' pontos · '+RANKS[rank][0]:'Suba de patente, de Cadete a Almirante';setB('oN','Novo jogo',start,1);if(getSave())setB('oC','Continuar jogo salvo',load);else $('oC').style.display='none'}}
function say(t,s=2){msg=t;mt=s}
function add(n){score+=n*mult;let r=rank;while(r+1<RANKS.length&&score>=RANKS[r+1][1])r++;if(r>rank){rank=r;say('PROMOÇÃO: '+RANKS[r][0]+'!',2.5);bp(660,.3,'triangle')}hud()}
function start(){score=0;balls=3;rank=0;state='play';paused=false;newBall();ov();say('Segure LANÇAR e solte',2.5)}

let ac;function bp(f,d=.08,t='square'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

function hit(ax,ay,bx,by,e){const dx=bx-ax,dy=by-ay;let t=((b.x-ax)*dx+(b.y-ay)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;let nx=b.x-(ax+dx*t),ny=b.y-(ay+dy*t);const d=Math.hypot(nx,ny);if(d>=R||d===0)return 0;nx/=d;ny/=d;b.x=ax+dx*t+nx*R;b.y=ay+dy*t+ny*R;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;return -vn}return 0}
function flip(f){const tx=f.px+f.s*Math.cos(f.a)*L,ty=f.py+Math.sin(f.a)*L,dx=tx-f.px,dy=ty-f.py;let t=((b.x-f.px)*dx+(b.y-f.py)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;const cx=f.px+dx*t,cy=f.py+dy*t,fr=7-3*t;let nx=b.x-cx,ny=b.y-cy;const d=Math.hypot(nx,ny);if(d>=R+fr||d===0)return;nx/=d;ny/=d;b.x=cx+nx*(R+fr);b.y=cy+ny*(R+fr);const r=t*L,vsx=-f.s*Math.sin(f.a)*f.w*r,vsy=Math.cos(f.a)*f.w*r,vn=(b.vx-vsx)*nx+(b.vy-vsy)*ny;if(vn<0){b.vx-=1.35*vn*nx;b.vy-=1.35*vn*ny}}
function gate(prevX,prevY){
  if(b.vy<0&&b.x>GATE.x-R&&Math.abs(b.y-GATE.y)<40)GATE.open=.16;
  const edge=GATE.y-R;
  // Testa o cruzamento inteiro para bloquear também retornos rápidos e diagonais.
  if(b.vy<=0||prevY>edge||b.y<edge||b.y===prevY)return;
  const x=prevX+(b.x-prevX)*(edge-prevY)/(b.y-prevY);
  if(x<GATE.x-R||x>GATE.end+R)return;
  b.x=x;b.y=edge;b.vy=-Math.max(180,b.vy*.65);b.vx=Math.min(-120,b.vx);GATE.open=0;
}
function step(h){
  tableTime+=h;GATE.open=Math.max(0,GATE.open-h);
  for(const s of S)s.cool=Math.max(0,(s.cool||0)-h);
  for(const u of BU){u.cool=Math.max(0,u.cool-h);u.f=Math.max(0,u.f-h*4);if(u.moving){const x=u.x;u.x=190+38*Math.sin(tableTime*1.6);u.vx=(u.x-x)/h}}
  for(const f of FL){const tg=f.on?A1:A0,o=f.a,st=20*h;f.a=Math.abs(tg-o)<st?tg:o+Math.sign(tg-o)*st;f.w=(f.a-o)/h}
  if(b.hid>0){b.hid-=h;if(b.hid<=0){const p=PO[b.to];b.x=p.x;b.y=p.y+16;b.vx=(b.to?-1:1)*140;b.vy=260;bp(880,.15,'sine')}return}
  const prevX=b.x,prevY=b.y;
  b.vy+=G*h;
  const sp=Math.hypot(b.vx,b.vy);if(sp>1500){b.vx*=1500/sp;b.vy*=1500/sp}
  b.x+=b.vx*h;b.y+=b.vy*h;gate(prevX,prevY);
  for(const s of S){const i=hit(s[0],s[1],s[2],s[3],s[4]);if(i>80&&s[5]&&!s.cool){
    const nx=s[0]<200?.806:-.806,ny=-.591;
    if((b.x-s[0])*nx+(b.y-s[1])*ny>0){b.vx+=nx*280;b.vy=Math.min(-260,b.vy+ny*360);s.cool=.15;add(10);bp(300,.05);vib(8)}
  }}
  for(const f of FL)flip(f);
  for(const u of BU){let nx=b.x-u.x,ny=b.y-u.y;const d=Math.hypot(nx,ny);if(d<R+u.r){
    if(d===0){nx=0;ny=-1}else{nx/=d;ny/=d}
    b.x=u.x+nx*(R+u.r);b.y=u.y+ny*(R+u.r);
    const vn=(b.vx-u.vx)*nx+b.vy*ny;
    if(vn<0){
      if(!u.cool){const v=Math.max(u.moving?500:560,Math.hypot(b.vx-u.vx,b.vy)*.9);b.vx=u.vx+nx*v;b.vy=ny*v;u.f=1;u.cool=.1;add(u.moving?200:100);bp(u.moving?820:520+Math.random()*200,.07);vib(12)}
      else{b.vx-=1.4*vn*nx;b.vy-=1.4*vn*ny}
    }
  }}
  PO.forEach((p,i)=>{if(Math.hypot(b.x-p.x,b.y-p.y)<12){b.hid=.7;b.to=1-i;b.vx=b.vy=0;b.x=p.x;b.y=p.y;add(500);say('Buraco de minhoca! +'+500*mult,1.2);vib(30)}});
  LT.forEach((p,i)=>{if(!lit[i]&&Math.hypot(b.x-p.x,b.y-p.y)<14){lit[i]=1;add(150);bp(760,.06,'sine');if(lit.every(Boolean)){mult=Math.min(5,mult+1);add(2000);say('Missão cumprida! Bônus x'+mult,2);lit=[0,0,0];hud();bp(990,.25,'triangle')}}});
}
function frame(dt){if(paused)return;
  if(state!=='play')return;
  if(charge)pw=Math.min(1,pw+dt*1.1);
  const lane=b.x>358&&b.y>240;
  const steps=Math.max(SUB,Math.ceil(dt*1500/(R*.5)));
  for(let i=0;i<steps;i++)step(dt/steps);
  if(!lane&&!b.hid&&Math.hypot(b.vx,b.vy)<20){b.idle+=dt;if(b.idle>2.5){b.vx=(Math.random()-.5)*400;b.vy=-300;b.idle=0}}else b.idle=0;
  if(b.y>H+20){balls--;bp(120,.4,'sawtooth');if(balls<=0){state='over';over=score;say('',0);hud();ov()}else{newBall();say('Bola perdida',1.5)}}
}
function launch(){if(state==='play'&&b.x>358&&b.y>640){b.vy=-(1100+pw*400);b.vx=0;bp(180,.2,'sawtooth')}pw=0}

/* ---------- cena 3D ---------- */
const T=THREE;let ren;
try{ren=new T.WebGLRenderer({canvas:cv,antialias:true});}catch(e){document.body.innerHTML='<p style="padding:24px">Este dispositivo não oferece WebGL, necessário para o modo 3D.</p>';throw e}
ren.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scn=new T.Scene();scn.background=new T.Color(0x05060f);
const cam=new T.PerspectiveCamera(40,1,10,4000);
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;ren.setSize(w,h);cam.aspect=w/h;const d=Math.max(930,640/cam.aspect);cam.position.set(0,.866*d,.5*d+20);cam.lookAt(0,0,20);cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

scn.add(new T.HemisphereLight(0xaac8ff,0x201040,.95));
const dl=new T.DirectionalLight(0xffffff,.75);dl.position.set(-200,500,300);scn.add(dl);
const pl=new T.PointLight(0x66ccff,.9,180);scn.add(pl);

/* textura da mesa */
const tc=document.createElement('canvas');tc.width=800;tc.height=1400;const q=tc.getContext('2d');q.scale(2,2);
q.fillStyle='#05060f';q.fillRect(0,0,W,H);
q.beginPath();q.moveTo(20,700);q.lineTo(20,200);q.arc(200,200,180,Math.PI,0);q.lineTo(380,700);q.closePath();
const gr=q.createLinearGradient(0,0,0,700);gr.addColorStop(0,'#10124a');gr.addColorStop(1,'#2a0f45');q.fillStyle=gr;q.fill();
q.save();q.clip();
for(let i=0;i<110;i++){q.globalAlpha=.3+Math.random()*.5;q.fillStyle='#fff';q.beginPath();q.arc(Math.random()*W,Math.random()*H,Math.random()*1.3+.3,0,7);q.fill()}
q.globalAlpha=1;q.strokeStyle='rgba(53,224,255,.25)';q.lineWidth=2;for(const r of [62,42,22]){q.beginPath();q.arc(190,430,r,0,7);q.stroke()}
q.fillStyle='rgba(255,255,255,.3)';q.font='700 13px "Trebuchet MS",sans-serif';q.textAlign='center';q.fillText('COSMIC CADET',190,434);
q.fillStyle='rgba(255,63,164,.18)';q.beginPath();q.arc(190,200,150,0,7);q.fill();
q.fillStyle='#090a1c';q.beginPath();q.moveTo(20,570);q.lineTo(130,630);q.lineTo(130,700);q.lineTo(20,700);q.fill();q.beginPath();q.moveTo(358,570);q.lineTo(250,630);q.lineTo(250,700);q.lineTo(358,700);q.fill();
q.fillStyle='rgba(53,224,255,.12)';q.fillRect(358,250,22,450);
q.restore();
const tex=new T.CanvasTexture(tc);tex.anisotropy=8;
const floor=new T.Mesh(new T.PlaneGeometry(W,H),new T.MeshPhongMaterial({map:tex,shininess:40,specular:0x223355}));floor.rotation.x=-Math.PI/2;scn.add(floor);

/* paredes */
const wm=new T.MeshPhongMaterial({color:0x167a9c,emissive:0x0a4660,shininess:80}),sm=new T.MeshPhongMaterial({color:0xff9a2e,emissive:0x8a4400,shininess:80});
for(const s of S){const dx=s[2]-s[0],dz=s[3]-s[1],len=Math.hypot(dx,dz),m=new T.Mesh(new T.BoxGeometry(len+4,18,8),s[5]?sm:wm);m.position.set((s[0]+s[2])/2-200,9,(s[1]+s[3])/2-350);m.rotation.y=-Math.atan2(dz,dx);scn.add(m)}
const gateMesh=new T.Group();gateMesh.position.set(GATE.x-200,8,GATE.y-350);
const gateArm=new T.Mesh(new T.BoxGeometry(GATE.end-GATE.x,5,4),new T.MeshPhongMaterial({color:0x65ffb4,emissive:0x126f45,shininess:100}));
gateArm.position.x=(GATE.end-GATE.x)/2;gateMesh.add(gateArm);scn.add(gateMesh);

/* bumpers */
const capM=new T.MeshPhongMaterial({color:0xffd0ea,emissive:0x442233,shininess:120});
BU.forEach(u=>{u.m=new T.MeshPhongMaterial({color:u.moving?0x35e0ff:0xff3fa4,emissive:0x5a0838,shininess:100});const g=new T.Group();u.mesh=g;g.position.set(u.x-200,0,u.y-350);g.scale.setScalar(u.r/24);
 const a=new T.Mesh(new T.CylinderGeometry(20,24,16,28),u.m);a.position.y=8;const c=new T.Mesh(new T.CylinderGeometry(11,15,8,28),capM);c.position.y=20;
 const r=new T.Mesh(new T.TorusGeometry(24,2,8,32),new T.MeshPhongMaterial({color:0x35e0ff,emissive:0x0a5a70}));r.rotation.x=Math.PI/2;r.position.y=2;g.add(a,c,r);scn.add(g)});

/* luzes de rolagem e buracos de minhoca */
const LM=LT.map(p=>{const m=new T.MeshPhongMaterial({color:0x2a2c4a});const e=new T.Mesh(new T.CylinderGeometry(8,8,2,20),m);e.position.set(p.x-200,1.5,p.y-350);scn.add(e);return m});
const PG=PO.map(p=>{const g=new T.Group();g.position.set(p.x-200,1.5,p.y-350);const pm=new T.MeshPhongMaterial({color:0xa66bff,emissive:0x5a2bb0});for(const [r,t] of [[12,1.6],[7,1.4]]){const o=new T.Mesh(new T.TorusGeometry(r,t,8,24),pm);o.rotation.x=Math.PI/2;g.add(o)}
 const d=new T.Mesh(new T.CircleGeometry(6,20),new T.MeshBasicMaterial({color:0x000000}));d.rotation.x=-Math.PI/2;d.position.y=-.4;g.add(d);scn.add(g);return g});

/* flippers */
const fm=new T.MeshPhongMaterial({color:0xff3fa4,emissive:0x6a0f40,shininess:90});
const fgeo=new T.CylinderGeometry(4,7,L,20);fgeo.rotateZ(-Math.PI/2);fgeo.translate(L/2,0,0);
const FM=FL.map(f=>{const g=new T.Group();g.position.set(f.px-200,8,f.py-350);g.add(new T.Mesh(fgeo,fm));const cap=new T.Mesh(new T.SphereGeometry(4,12,8),fm);cap.position.x=L;g.add(cap);scn.add(g);return g});

/* bola, sombra e barra de força */
const ball=new T.Mesh(new T.SphereGeometry(R,28,18),new T.MeshPhongMaterial({color:0xdfe6ff,specular:0xffffff,shininess:140,emissive:0x1a2038}));scn.add(ball);
const shd=new T.Mesh(new T.CircleGeometry(9,20),new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.45}));shd.rotation.x=-Math.PI/2;scn.add(shd);
const pgeo=new T.BoxGeometry(16,2,5);pgeo.translate(8,0,0);const pbar=new T.Mesh(pgeo,new T.MeshBasicMaterial({color:0x35e0ff}));pbar.position.set(161,1,344.5);scn.add(pbar);

function sync(t){
  const sink=b.y>690&&b.x<358?(b.y-690)*.9:0;
  ball.visible=shd.visible=pl.visible=!b.hid;
  ball.position.set(b.x-200,R-sink,b.y-350);ball.rotation.x=b.y*.12;ball.rotation.z=-b.x*.12;
  shd.position.set(b.x-200+3,.4,b.y-350+3);pl.position.set(b.x-200,45,b.y-350);
  FL.forEach((f,i)=>FM[i].rotation.y=-Math.atan2(Math.sin(f.a),f.s*Math.cos(f.a)));
  for(const u of BU){u.mesh.position.x=u.x-200;u.m.emissive.setRGB((u.moving?.03:.35)+u.f*.65,(u.moving?.3:.03)+u.f*.7,.22+u.f*.7)}
  gateMesh.rotation.y=GATE.open>0?Math.PI*.44:0;
  LM.forEach((m,i)=>{m.color.setHex(lit[i]?0xffe45e:0x2a2c4a);m.emissive.setHex(lit[i]?0xffbb22:0)});
  PG.forEach(g=>g.rotation.y=t/300);
  pbar.scale.x=Math.max(.001,pw);
  $('mg').textContent=msg;$('mg').style.opacity=mt>0?Math.min(1,mt):0;
}
let last=0;
function loop(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;if(mt>0)mt-=dt;frame(dt);sync(t);ren.render(scn,cam);requestAnimationFrame(loop)}
newBall();ov();requestAnimationFrame(loop);

/* ---------- controles ---------- */
const setF=(i,v)=>{if(paused&&v)return;if(FL[i].on!==v&&v)bp(220,.05);FL[i].on=v;(i?$('bR'):$('bL')).classList.toggle('on',!!v)};
const plunger=v=>{if(paused)return;if(v){if(state!=='play'){start();return}charge=true}else if(charge){charge=false;launch()}};
const KL=['KeyA','ArrowLeft','KeyZ','ShiftLeft'],KR=['KeyD','ArrowRight','Slash','KeyM','ShiftRight'];
addEventListener('keydown',e=>{if(e.repeat)return;const c=e.code;if(KL.includes(c))setF(0,1);else if(KR.includes(c))setF(1,1);else if(c==='Space'||c==='ArrowDown'||c==='KeyS')plunger(1);else if(c==='KeyP'||c==='Escape')togglePause();else return;e.preventDefault()});
addEventListener('keyup',e=>{const c=e.code;if(KL.includes(c))setF(0,0);else if(KR.includes(c))setF(1,0);else if(c==='Space'||c==='ArrowDown'||c==='KeyS')plunger(0);else return;e.preventDefault()});
function bind(id,fn){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);fn(1)});['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,()=>fn(0)))}
bind('bL',v=>setF(0,v?1:0));bind('bR',v=>setF(1,v?1:0));bind('bP',v=>plunger(v?1:0));
addEventListener('contextmenu',e=>e.preventDefault());
function getSave(){try{const d=JSON.parse(localStorage.getItem('cosmicCadet:v1'));return d&&typeof d.score==='number'&&d.b&&Array.isArray(d.lit)?d:null}catch(e){return null}}
function save(){if(state!=='play')return false;try{localStorage.setItem('cosmicCadet:v1',JSON.stringify({score,balls,mult,rank,lit,tableTime,b:{x:b.x,y:b.y,vx:b.vx,vy:b.vy}}));return true}catch(e){return false}}
function load(){const d=getSave();if(!d)return;score=d.score|0;balls=Math.min(3,Math.max(1,d.balls|0));mult=Math.min(5,Math.max(1,d.mult|0));rank=Math.min(RANKS.length-1,Math.max(0,d.rank|0));lit=[0,1,2].map(i=>d.lit[i]?1:0);b={x:+d.b.x||369,y:+d.b.y||680,vx:+d.b.vx||0,vy:+d.b.vy||0,hid:0,to:0,idle:0};resetObstacles(Number.isFinite(d.tableTime)?d.tableTime:0);charge=false;pw=0;state='play';paused=false;hud();ov();say('Jogo carregado',1.8)}
function doSave(){say(save()?'Jogo salvo!':'Não foi possível salvar neste navegador',2)}
function togglePause(){if(state!=='play')return;paused=!paused;if(paused){setF(0,0);setF(1,0);charge=false;pw=0}$('bPa').textContent=paused?'▶ Continuar':'⏸ Pausar';ov()}
$('bPa').onclick=togglePause;$('bSv').onclick=doSave;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)togglePause()});
addEventListener('blur',()=>{setF(0,0);setF(1,0);charge=false;pw=0});
</script>
</body>
